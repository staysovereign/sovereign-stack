# Sovereign — complete stack
#
# Core stack (always running):
#   docker compose up -d
#
# With WhatsApp Matrix bridge:
#   docker compose --profile whatsapp up -d
#
# First-time setup:
#   ./setup.sh

services:

  # ── Core engine (FastAPI / Python) ────────────────────────────────
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    env_file: .env
    environment:
      - SOVEREIGN_DB_PATH=/data/sovereign.db
    volumes:
      - sovereign_data:/data
    restart: unless-stopped
    networks:
      - sovereign
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Interface (React build served by Nginx) ───────────────────────
  interface:
    build:
      context: .
      dockerfile: interface/Dockerfile
    ports:
      - "${INTERFACE_PORT:-80}:80"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sovereign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Connectors (Node.js) ──────────────────────────────────────────
  connectors:
    build: ./connectors
    env_file: .env
    environment:
      - CORE_INGEST_URL=http://core:8000/ingest
    volumes:
      - connector_data:/data
    ports:
      - "4000:3000"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sovereign
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Ollama (local LLM — Advisor only) ────────────────────────────
  # Pull a model after first start:
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - sovereign
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Synapse (Matrix homeserver — WhatsApp bridge only) ───────────
  # Requires first-time setup:  ./setup.sh --whatsapp
  # Then scan QR code:          docker compose logs -f mautrix
  synapse:
    image: matrixdotorg/synapse:latest
    profiles: [whatsapp]
    volumes:
      - synapse_data:/data
      - ./mautrix/registration.yaml:/data/appservices/whatsapp-registration.yaml:ro
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    restart: unless-stopped
    networks:
      - sovereign
    healthcheck:
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── mautrix-whatsapp (Matrix ↔ WhatsApp bridge) ──────────────────
  mautrix:
    image: dock.mau.dev/mautrix/whatsapp:latest
    profiles: [whatsapp]
    # bridgev2 keeps config.yaml, registration.yaml and its DB together in /data.
    # Bind the host ./mautrix dir so config/registration are editable on the host.
    volumes:
      - ./mautrix:/data
    depends_on:
      synapse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sovereign

volumes:
  sovereign_data:
  ollama_data:
  synapse_data:
  mautrix_data:
  connector_data:

networks:
  sovereign:
    driver: bridge
