services:

  core:
    build: ./core
    env_file: .env
    environment:
      - SOVEREIGN_DB_PATH=/data/sovereign.db
    ports:
      - "8000:8000"
    volumes:
      - sovereign_data:/data
    restart: unless-stopped
    networks:
      - sovereign

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - sovereign
    # To pull a model after first start:
    #   docker compose exec ollama ollama pull llama3.2

  connectors:
    build: ./connectors
    env_file: .env
    environment:
      - CORE_INGEST_URL=http://core:8000/ingest
    ports:
      - "3000:3000"
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - sovereign

volumes:
  sovereign_data:
  ollama_data:

networks:
  sovereign:
    driver: bridge
