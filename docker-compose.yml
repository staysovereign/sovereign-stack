services:

  core:
    build: ./core
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - sovereign

  connectors:
    build: ./connectors
    env_file: .env
    environment:
      - CORE_INGEST_URL=http://core:8000/ingest
    ports:
      - "3000:3000"
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - sovereign

networks:
  sovereign:
    driver: bridge
