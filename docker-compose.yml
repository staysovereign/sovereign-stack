services:

  core:
    build: ./core
    env_file: .env
    environment:
      - SOVEREIGN_DB_PATH=/data/sovereign.db
    ports:
      - "8000:8000"
    volumes:
      - sovereign_data:/data
    restart: unless-stopped
    networks:
      - sovereign

  connectors:
    build: ./connectors
    env_file: .env
    environment:
      - CORE_INGEST_URL=http://core:8000/ingest
    ports:
      - "3000:3000"
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - sovereign

volumes:
  sovereign_data:

networks:
  sovereign:
    driver: bridge
